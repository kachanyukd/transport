[project]
name = "fleet-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fleet.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=70 -v"

[tool.coverage.run]
source = ["apps"]
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["N818"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "fleet*"]
